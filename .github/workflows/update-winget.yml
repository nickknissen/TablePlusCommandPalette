name: Update WinGet

# Submits a `wingetcreate update` PR to microsoft/winget-pkgs whenever a
# GitHub Release with MSIX assets is published.
#
# IMPORTANT: This workflow only handles UPDATES (existing manifest in
# winget-pkgs). The FIRST submission for nickknissen.TablePlusCommandPalette
# must be done once manually with `wingetcreate new` because the package
# metadata (PackageName, ShortDescription, License, etc.) doesn't exist
# yet for `update` to extend.
#
# After that first manifest is merged, every subsequent release flows
# through this workflow automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.event.release.tag_name }}" -replace '^v', ''
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install wingetcreate
        shell: pwsh
        run: Invoke-WebRequest -Uri https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Update WinGet manifest
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $repo = "${{ github.repository }}"

          # The MSIX assets are attached to the GitHub release by build-msix.ps1.
          # File naming matches what build-msix.ps1 produces: <Name>_<Version>.0_<arch>.msix.
          $x64Url   = "https://github.com/$repo/releases/download/$version/TablePlusCommandPalette_${version}.0_x64.msix"
          $arm64Url = "https://github.com/$repo/releases/download/$version/TablePlusCommandPalette_${version}.0_arm64.msix"

          # wingetcreate auto-detects InstallerType=msix from the file extension
          # and computes InstallerSha256, SignatureSha256, and PackageFamilyName
          # by inspecting each MSIX. No extra metadata injection needed for MSIX.
          .\wingetcreate.exe update nickknissen.TablePlusCommandPalette `
            --version $version `
            --urls "$x64Url|x64" "$arm64Url|arm64" `
            --out manifests

          $token = "${{ secrets.WINGET_PAT }}"
          if (-not $token) {
            Write-Error "WINGET_PAT secret is not set or empty"
            exit 1
          }

          $manifestDir = (Get-ChildItem -Path manifests -Recurse -Filter "*.yaml" | Select-Object -First 1).DirectoryName
          .\wingetcreate.exe submit `
            --token "$token" `
            "$manifestDir"
